<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="P130 Reset Password">
  <title>P130 設定新密碼 | Account Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><a href="https://tcubmdsbilab.github.io/P101/">慈濟大學　經營管理學系　好玩實驗室　作品</a></header>
  <main class="shell">
    <section class="brand">
      <p class="eyebrow">SBI LAB · P130</p>
      <h1>設定新密碼<br><span>Reset Password</span></h1>
      <p>完成後，所有共用同一套 Supabase Auth 的 P 系列專案都使用新密碼。</p>
    </section>
    <section class="card">
      <div id="notice" class="notice" role="status">正在驗證重設連結…</div>
      <form id="resetForm" hidden>
        <h2>設定新密碼 <small>Set new password</small></h2>
        <label>新密碼 <small>At least 8 characters</small><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="primary" type="submit">更新密碼 Update password</button>
      </form>
      <a class="link-button" href="index.html">回到帳號中心 Back to Account Center</a>
      <p id="configWarning" class="hint config-warning" hidden>尚未設定 Supabase。請建立 <code>config.js</code>。</p>
    </section>
  </main>
  <footer>SBI Lab P130 · 帳號共用，權限分開</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="reset-password.js?v=20260924-1"></script>
</body>
</html>
