<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="P130 Forgot Password">
  <title>P130 忘記密碼 | Account Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><a href="https://tcubmdsbilab.github.io/P101/">慈濟大學　經營管理學系　好玩實驗室　作品</a></header>
  <main class="shell">
    <section class="brand">
      <p class="eyebrow">SBI LAB · P130</p>
      <h1>忘記密碼<br><span>Forgot Password</span></h1>
      <p>重設所有共用 SBI Lab Auth 專案使用的密碼。</p>
    </section>
    <section class="card">
      <div id="notice" class="notice" role="status" hidden></div>
      <form id="forgotForm">
        <h2>寄送重設連結 <small>Send reset link</small></h2>
        <p class="hint">請輸入註冊 Email。收到信後，連結會回到 P130 的密碼重設頁。</p>
        <label>Email<input id="forgotEmail" type="email" autocomplete="email" required></label>
        <button class="primary" type="submit">寄送重設連結 Send reset link</button>
        <a class="link-button" href="index.html">回到帳號中心 Back to Account Center</a>
      </form>
      <p id="configWarning" class="hint config-warning" hidden>尚未設定 Supabase。請建立 <code>config.js</code>。</p>
    </section>
  </main>
  <footer>SBI Lab P130 · 帳號共用，權限分開</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="forgot-password.js?v=20260924-1"></script>
</body>
</html>
